name: Build APK

on:
  push:
    branches: [main, master, "claude/**"]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Análisis estático
        run: flutter analyze

      - name: Pruebas
        run: flutter test

      - name: Compilar APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          cp build/app/outputs/flutter-apk/app-release.apk NutriSemaforo.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NutriSemaforo-apk
          path: NutriSemaforo.apk

      - name: Publicar Release con el APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build.${{ github.run_number }}
          name: NutriSemáforo 1.0.0 (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: NutriSemaforo.apk
          body: |
            APK de NutriSemáforo para Android (7.0 o superior).
            Descarga `NutriSemaforo.apk`, ábrelo en tu teléfono y permite "instalar apps de origen desconocido".
