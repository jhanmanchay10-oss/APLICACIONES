name: Deploy backend (Supabase + IA)

# Despliega la base de datos y las funciones de IA en Supabase sin usar la terminal.
# Secretos necesarios (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  token personal de supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   referencia del proyecto (la parte xxxx de https://xxxx.supabase.co)
#   SUPABASE_DB_PASSWORD   contraseña de la base de datos del proyecto
#   CLAUDE_API_KEY         clave de Claude (oficial o de un servicio compatible como mwapi.dev)
#   OPENAI_API_KEY         (alternativa) clave de platform.openai.com; se usa solo si no hay CLAUDE_API_KEY
# Variables opcionales (Settings → Secrets and variables → Actions → Variables):
#   CLAUDE_BASE_URL        por defecto https://api.mwapi.dev/v1 (oficial: https://api.anthropic.com/v1)
#   CLAUDE_MODEL           por defecto claude-opus-5 (p. ej. claude-sonnet-5 o claude-haiku-4-5-20251001)

on:
  push:
    branches: [main, master, "claude/**"]
    paths: ["supabase/**", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  CLAUDE_BASE_URL: ${{ vars.CLAUDE_BASE_URL || secrets.CLAUDE_BASE_URL || 'https://api.mwapi.dev/v1' }}
  CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || secrets.CLAUDE_MODEL || 'claude-opus-5' }}

jobs:
  test-ai-key:
    name: Probar la clave de IA
    runs-on: ubuntu-latest
    env:
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
    steps:
      - name: Probar CLAUDE_API_KEY con una consulta mínima
        run: |
          # Quita espacios o saltos de línea que a veces se cuelan al pegar la clave.
          CLAUDE_API_KEY="$(printf '%s' "$CLAUDE_API_KEY" | tr -d '[:space:]')"
          if [ -z "$CLAUDE_API_KEY" ]; then
            echo "::notice title=Sin clave de Claude::Agrega el secreto CLAUDE_API_KEY para usar Claude."
            exit 0
          fi
          echo "::add-mask::$CLAUDE_API_KEY"
          echo "Clave: ${#CLAUDE_API_KEY} caracteres, empieza con '${CLAUDE_API_KEY:0:3}'"
          CLAUDE_MODEL="$(printf '%s' "$CLAUDE_MODEL" | tr -d '[:space:]')"
          base="$(printf '%s' "${CLAUDE_BASE_URL%/}" | tr -d '[:space:]')"
          echo "Servicio: $base · Modelo: $CLAUDE_MODEL"
          payload=$(jq -n --arg model "$CLAUDE_MODEL" \
            '{model: $model, max_tokens: 1000, messages: [{role: "user", content: "Responde solo con la palabra OK"}]}')

          status=$(curl -sS -o anthropic.json -w '%{http_code}' -m 120 "$base/messages" \
            -H "content-type: application/json" -H "anthropic-version: 2023-06-01" \
            -H "x-api-key: $CLAUDE_API_KEY" -H "Authorization: Bearer $CLAUDE_API_KEY" -d "$payload" || echo 000)
          echo "Formato Anthropic ($base/messages): HTTP $status"
          head -c 400 anthropic.json; echo
          if [ "$status" = "200" ]; then
            echo "::notice title=Clave de IA válida::Claude responde con el formato de Anthropic ($CLAUDE_MODEL)."

            exit 0
          fi

          status2=$(curl -sS -o openai.json -w '%{http_code}' -m 120 "$base/chat/completions" \
            -H "content-type: application/json" -H "Authorization: Bearer $CLAUDE_API_KEY" -d "$payload" || echo 000)
          echo "Formato compatible con OpenAI ($base/chat/completions): HTTP $status2"
          head -c 400 openai.json; echo
          if [ "$status2" = "200" ]; then
            echo "::notice title=Clave de IA válida::Claude responde con el formato compatible con OpenAI ($CLAUDE_MODEL)."
            exit 0
          fi
          echo "::error title=La clave de IA no funcionó::Anthropic HTTP $status, OpenAI HTTP $status2. Revisa la clave, el saldo y el modelo."
          exit 1

  check:
    name: Revisar funciones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verificar tipos
        run: deno check supabase/functions/*/index.ts

  deploy:
    name: Desplegar en Supabase
    needs: check
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Comprobar secretos
        id: secrets
        run: |
          # Quita espacios o saltos de línea que a veces se cuelan al pegar los secretos.
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD CLAUDE_API_KEY OPENAI_API_KEY CLAUDE_MODEL CLAUDE_BASE_URL; do
            value="$(printf '%s' "${!name}" | tr -d '[:space:]')"
            case "$name" in CLAUDE_MODEL|CLAUDE_BASE_URL) ;; *) if [ -n "$value" ]; then echo "::add-mask::$value"; fi ;; esac
            echo "$name=$value" >> "$GITHUB_ENV"
            export "$name=$value"
          done
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning title=Backend sin configurar::Agrega SUPABASE_ACCESS_TOKEN y SUPABASE_PROJECT_REF en los secretos del repositorio para activar la IA."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: latest

      - name: Aplicar base de datos (tablas, seguridad y fotos)
        if: steps.secrets.outputs.ready == 'true' && env.SUPABASE_DB_PASSWORD != ''
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          echo "Y" | supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Guardar la clave de Claude en el servidor
        if: steps.secrets.outputs.ready == 'true' && env.CLAUDE_API_KEY != ''
        run: |
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            CLAUDE_API_KEY="$CLAUDE_API_KEY" \
            CLAUDE_BASE_URL="$CLAUDE_BASE_URL" \
            CLAUDE_MODEL="$CLAUDE_MODEL"

      - name: Guardar la clave de OpenAI en el servidor
        if: steps.secrets.outputs.ready == 'true' && env.OPENAI_API_KEY != ''
        run: supabase secrets set OPENAI_API_KEY="$OPENAI_API_KEY" --project-ref "$SUPABASE_PROJECT_REF"

      - name: Activar sesión de invitado (usar la IA sin crear cuenta)
        if: steps.secrets.outputs.ready == 'true'
        continue-on-error: true
        run: |
          curl -sS --fail-with-body -X PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"external_anonymous_users_enabled": true}' > /dev/null
          echo "Sesión de invitado activada."

      - name: Desplegar funciones de IA
        if: steps.secrets.outputs.ready == 'true'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Probar la app de punta a punta (foto de ejemplo y Nutri)
        if: steps.secrets.outputs.ready == 'true' && github.event_name == 'workflow_dispatch'
        run: |
          base="https://$SUPABASE_PROJECT_REF.supabase.co"
          key=$(curl -sS "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '[.[] | select(.type == "publishable")][0].api_key // ([.[] | select(.name == "anon")][0].api_key)')
          token=$(curl -sS -X POST "$base/auth/v1/signup" -H "apikey: $key" -H "content-type: application/json" -d '{}' | jq -r '.access_token // empty')
          if [ -z "$token" ]; then echo "::error::No se pudo iniciar la sesión de invitado"; exit 1; fi
          echo "::add-mask::$token"
          jq -n --arg img "$(base64 -w0 .github/test-assets/plato.jpg)" '{image_base64: $img, media_type: "image/jpeg"}' > photo.json
          s1=$(curl -sS -o photo_out.json -w '%{http_code}' -m 150 -X POST "$base/functions/v1/analyze-meal" \
            -H "apikey: $key" -H "Authorization: Bearer $token" -H "content-type: application/json" -d @photo.json)
          echo "Foto: HTTP $s1"; jq -c '{dish_name, overall_confidence, foods: [.foods[]?.name], error}' photo_out.json || cat photo_out.json; echo
          s2=$(curl -sS -o chat_out.json -w '%{http_code}' -m 150 -X POST "$base/functions/v1/nutrition-assistant" \
            -H "apikey: $key" -H "Authorization: Bearer $token" -H "content-type: application/json" \
            -d '{"messages":[{"role":"user","content":"Dame un consejo corto para comer más verduras."}]}')
          echo "Nutri: HTTP $s2"; jq -c '{reply: (.reply // "" | .[0:200]), error}' chat_out.json || cat chat_out.json; echo
          if [ "$s1" != "200" ] || [ "$(jq '.foods | length' photo_out.json)" = "0" ] || [ "$s2" != "200" ]; then
            echo "::error title=Prueba de la app::La foto o Nutri no respondieron bien (foto HTTP $s1, Nutri HTTP $s2)."
            exit 1
          fi
          echo "::notice title=App lista::La foto de ejemplo y Nutri funcionan de punta a punta."
