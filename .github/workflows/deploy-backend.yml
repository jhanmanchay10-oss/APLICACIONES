name: Deploy backend (Supabase + IA)

# Despliega la base de datos y las funciones de IA en Supabase sin usar la terminal.
# Secretos necesarios (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  token personal de supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   referencia del proyecto (la parte xxxx de https://xxxx.supabase.co)
#   SUPABASE_DB_PASSWORD   contraseña de la base de datos del proyecto
#   OPENAI_API_KEY         clave de platform.openai.com (sk-...)

on:
  push:
    branches: [main, master, "claude/**"]
    paths: ["supabase/**", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Revisar funciones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verificar tipos
        run: deno check supabase/functions/*/index.ts

  deploy:
    name: Desplegar en Supabase
    needs: check
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Comprobar secretos
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning title=Backend sin configurar::Agrega SUPABASE_ACCESS_TOKEN y SUPABASE_PROJECT_REF en los secretos del repositorio para activar la IA."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: latest

      - name: Aplicar base de datos (tablas, seguridad y fotos)
        if: steps.secrets.outputs.ready == 'true' && env.SUPABASE_DB_PASSWORD != ''
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          echo "Y" | supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Guardar la clave de OpenAI en el servidor
        if: steps.secrets.outputs.ready == 'true' && env.OPENAI_API_KEY != ''
        run: supabase secrets set OPENAI_API_KEY="$OPENAI_API_KEY" --project-ref "$SUPABASE_PROJECT_REF"

      - name: Activar sesión de invitado (usar la IA sin crear cuenta)
        if: steps.secrets.outputs.ready == 'true'
        continue-on-error: true
        run: |
          curl -sS --fail-with-body -X PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"external_anonymous_users_enabled": true}' > /dev/null
          echo "Sesión de invitado activada."

      - name: Desplegar funciones de IA
        if: steps.secrets.outputs.ready == 'true'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
